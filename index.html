<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>보안운영팀 모의테스트</title>
<meta name="application-name" content="보안운영팀 모의테스트">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f4f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100vh}
button,select,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:760px;margin:0 auto;padding-bottom:40px}
.header{position:sticky;top:0;z-index:100;background:#111;color:#fff;padding:15px 16px calc(15px + env(safe-area-inset-top));font-weight:800;font-size:18px}
.page{display:none;padding:14px}
.page.active{display:block}
.home{min-height:calc(100vh - 70px);display:flex;flex-direction:column;justify-content:center;padding:28px}
.home h1{text-align:center;font-size:28px;line-height:1.25;margin:0 0 34px;font-weight:900}
.home button{width:100%;height:58px;border:0;border-radius:14px;margin:0 0 12px;font-weight:800;font-size:17px}
.home .start{background:#111;color:#fff}
.home .view{background:#fff;color:#111;border:1px solid #d8dadd}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.title{font-weight:900;font-size:17px}
label{display:block;font-size:13px;font-weight:800;color:#5d636c;margin:13px 0 6px}
select,input{width:100%;height:50px;border:1px solid #cfd3d8;border-radius:11px;background:#fff;padding:0 12px;font-size:16px;color:#111}
select:disabled{background:#eceef1;color:#999}
.section-note{font-size:12px;color:#777;margin-top:5px;line-height:1.5}
.category-grid{display:grid;gap:10px}
.category-grid button{width:100%;text-align:left;border:1px solid #dadde1;background:#fff;border-radius:12px;padding:14px;font-weight:800}
.category-grid button.active{background:#111;color:#fff}
.question{padding:14px 0;border-top:1px solid #eceef1}
.question:first-child{border-top:0}
.qtext{font-size:15px;font-weight:800;line-height:1.5}
.criteria{margin:9px 0 0 18px;padding:0;color:#5c626a;font-size:13px;line-height:1.6}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.score-grid button{height:44px;border:0;border-radius:10px;background:#e9ebee;font-weight:800}
.score-grid button.selected{background:#111;color:#fff}
.total{font-size:24px;font-weight:900;text-align:center;padding:14px 0}
.finish{width:100%;height:54px;border:0;border-radius:13px;background:#111;color:#fff;font-size:17px;font-weight:900;opacity:.35}
.finish.ready{opacity:1}
.back{display:flex;align-items:center;gap:4px;padding:2px 0 12px;font-weight:800;font-size:14px}
.top-btn{position:fixed;right:18px;bottom:18px;z-index:200;width:52px;height:52px;border:0;border-radius:50%;background:#111;color:#fff;font-size:23px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.22);display:none}
.record-toolbar{display:flex;gap:8px;align-items:center}
.record-toolbar select{flex:1}
.record-list .record{border:1px solid #e0e3e7;border-radius:13px;padding:12px;margin-top:10px;background:#fff}
.record-head{display:flex;align-items:flex-start;gap:9px}
.record-check{width:20px;height:20px;flex:0 0 auto;margin-top:2px}
.record-title{font-weight:900;font-size:14px;line-height:1.45}
.record-meta{font-size:12px;color:#666;margin-top:3px}
.record-total{font-size:13px;font-weight:900;margin-top:8px}
.record-result{margin-top:10px}
.record-result summary{cursor:pointer;font-weight:800}
.result-cat{margin-top:10px;padding-top:10px;border-top:1px solid #eee}
.result-q{padding:8px 0;border-top:1px solid #f0f1f2;font-size:13px;line-height:1.5}
.delete-one{margin-top:10px;width:100%;height:42px;border:0;border-radius:10px;background:#eee;font-weight:800}
.delete-bar{display:flex;gap:8px;margin-top:12px}
.delete-bar button{flex:1;height:45px;border:0;border-radius:10px;font-weight:800}
.empty{padding:22px 8px;color:#888;text-align:center;font-size:13px}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보안모의테스트">
<link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>
<div class="app">
<div class="header">🔐 보안운영팀 모의테스트</div>

<section id="homePage" class="page active">
  <div class="home">
    <h1>보안운영팀 모의테스트</h1>
    <button id="startBtn" class="start" type="button">평가시작</button>
    <button id="viewBtn" class="view" type="button">평가조회</button>
  </div>
</section>

<section id="evalPage" class="page">
  <div id="backEval" class="back">‹ 처음으로</div>

  <div class="card">
    <div class="title">① 평가 기본정보</div>
    <label>권역</label>
    <select id="region"><option value="">권역 선택</option></select>
    <label>구역</label>
    <select id="site" disabled><option value="">권역을 먼저 선택하세요</option></select>
    <label>평가일</label>
    <input id="date" type="date">
    <label>피평가자</label>
    <input id="evaluator" type="text" placeholder="피평가자 이름" autocomplete="off">
  </div>

  <div class="card">
    <div class="title">② 평가항목</div>
    <div class="section-note">구역 유형에 따라 평가할 대분류가 자동으로 정해집니다.</div>
    <label>대분류</label>
    <div id="categoryGrid" class="category-grid"></div>
  </div>

  <div id="questionCard" class="card" style="display:none">
    <div class="title">③ 평가 점수</div>
    <div id="questions"></div>
    <div id="total" class="total">총점 0 / 100점</div>
    <button id="finish" class="finish" type="button">평가완료</button>
  </div>
</section>

<section id="viewPage" class="page">
  <div id="backView" class="back">‹ 처음으로</div>
  <div class="card">
    <div class="title">평가조회</div>
    <div class="record-toolbar">
      <select id="recordMonth"><option value="ALL">전체 월</option></select>
    </div>
    <div id="records" class="record-list"></div>
    <div class="delete-bar">
      <button id="deleteSelected" type="button">선택삭제</button>
      <button id="deleteAll" type="button">전체삭제</button>
    </div>
  </div>
</section>

<button id="topBtn" class="top-btn" type="button" aria-label="맨 위로">↑</button>
</div>

<script>

  }
  function page(p){
    [home,evalPage,viewPage].forEach(x=>x.classList.remove("active"));
    p.classList.add("active");
    topBtn.style.display=(p===evalPage)?"block":"none";
    window.scrollTo(0,0);
  }
  function resetEval(){
    scoresByCategory={}; selectedCategory="";
    categoryGrid.innerHTML="";
    questionsEl.innerHTML="";
    questionCard.style.display="none";
    totalEl.textContent="총점 0 / 100점";
    finish.classList.remove("ready");
    finish.disabled=true;
  }
  function populateCats(){
    categoryGrid.innerHTML="";
    const req=requiredCats();
    req.forEach(cat=>{
      const b=document.createElement("button");
      b.type="button"; b.textContent=cat;
      if(cat===selectedCategory)b.classList.add("active");
      b.addEventListener("click",()=>selectCat(cat));
      categoryGrid.appendChild(b);
    });
  }
  function selectCat(cat){
    selectedCategory=cat;
    populateCats();
    renderCategory();
  }
  function renderCategory(){
    questionsEl.innerHTML="";
    const arr=DATA.categories[selectedCategory]||[];
    arr.forEach(q=>{
      const box=document.createElement("div");
      box.className="question";
      box.dataset.no=q.no;
      let h='<div class="qtext">'+escapeHTML(q.no+". "+q.text)+'</div>';
      if(q.items&&q.items.length){
        h+='<ul class="criteria">';
        q.items.forEach(it=>h+='<li>'+escapeHTML(it)+'</li>');
        h+='</ul>';
      }
      h+='<div class="score-grid">';
      scoreOptions(selectedCategory,q.no).forEach(v=>{
        h+='<button type="button" data-v="'+v+'">'+v+'점</button>';
      });
      h+='</div>';
      box.innerHTML=h;
      box.querySelectorAll(".score-grid button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          box.querySelectorAll(".score-grid button").forEach(x=>x.classList.remove("selected"));
          btn.classList.add("selected");
          saveCurrentCategory();
        });
      });
      questionsEl.appendChild(box);
    });
    questionCard.style.display=arr.length?"block":"none";
    restoreCurrentCategory();
    saveCurrentCategory();
  }
  function saveCurrentCategory(){
    if(!selectedCategory)return false;
    const arr=[...questionsEl.querySelectorAll(".question")];
    if(!arr.length)return false;
    const obj={}; let complete=true, sum=0, max=0;
    arr.forEach(q=>{
      const no=Number(q.dataset.no);
      max+=Math.max(...scoreOptions(selectedCategory,no));
      const b=q.querySelector(".score-grid button.selected");
      if(!b) complete=false;
      else { obj[String(no)]=Number(b.dataset.v); sum+=Number(b.dataset.v); }
    });
    if(complete)scoresByCategory[selectedCategory]=obj;
    else delete scoresByCategory[selectedCategory];
    updateCurrentTotal(sum,max);
    updateFinish();
    return complete;
  }
  function restoreCurrentCategory(){
    const saved=scoresByCategory[selectedCategory];
    if(!saved)return;
    [...questionsEl.querySelectorAll(".question")].forEach(q=>{
      const v=saved[String(q.dataset.no)];
      if(v===undefined)return;
      const b=q.querySelector('.score-grid button[data-v="'+v+'"]');
      if(b)b.classList.add("selected");
    });
  }
  function updateCurrentTotal(sum,max){
    totalEl.textContent=selectedCategory==="물품반출입" ? ("현재 점수 "+sum+" / "+max+"점") : ("현재 점수 "+sum+" / "+max+"점");
  }
  function updateFinish(){
    const req=requiredCats();
    finish.disabled=!req.every(c=>!!scoresByCategory[c]);
    finish.classList.toggle("ready",!finish.disabled);
  }
  function finishEvaluation(){
    saveCurrentCategory();
    const req=requiredCats();
    if(!req.every(c=>!!scoresByCategory[c])){
      const missing=req.find(c=>!scoresByCategory[c]);
      alert(missing+" 평가를 모두 입력해주세요.");
      selectCat(missing);
      return;
    }
    if(!region.value||!site.value||!dateEl.value||!evaluator.value.trim()){
      alert("권역, 구역, 평가일, 피평가자를 확인해주세요.");
      return;
    }
    let grand=0, count=req.length;
    const categories={};
    req.forEach(cat=>{
      const src=DATA.categories[cat]||[];
      let sum=0,max=0,qs=[];
      src.forEach(q=>{
        const opts=scoreOptions(cat,q.no);
        max+=Math.max(...opts);
        const score=Number(scoresByCategory[cat][String(q.no)]);
        sum+=score;
        qs.push({no:q.no,text:q.text,criteria:q.items||[],score:score});
      });
      categories[cat]={sum,max,questions:qs};
      grand+=sum;
    });
    const normalized=Math.round((grand/count)*10)/10;
    const all=loadRecords();
    all.unshift({
      id:Date.now(),
      region:region.value,
      site:site.value,
      date:dateEl.value,
      evaluator:evaluator.value.trim(),
      savedAt:new Date().toISOString(),
      categories:categories,
      score:normalized.toFixed(1)+" / 100"
    });
    saveRecords(all);
    alert("평가가 저장되었습니다.");
    // Return to first page exactly as requested.
    page(home);
    resetEval();
    dateEl.value=today();
  }
  function loadRecords(){
    try{return JSON.parse(localStorage.getItem("security_mock_records")||"[]");}
    catch(e){return[];}
  }
  function saveRecords(a){
    localStorage.setItem("security_mock_records",JSON.stringify(a));
  }
  function formatTime(iso){
    const d=new Date(iso);
    if(isNaN(d.getTime()))return "--:--";
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function monthKey(v){return String(v||"").slice(0,7);}
  function refreshMonths(){
    const months={};
    loadRecords().forEach(r=>{const m=monthKey(r.date); if(m)months[m]=1;});
    const old=recordMonth.value;
    recordMonth.innerHTML='<option value="ALL">전체 월</option>';
    Object.keys(months).sort().reverse().forEach(m=>recordMonth.add(new Option(m.slice(0,4)+"년 "+m.slice(5)+"월",m)));
    if(months[old])recordMonth.value=old;
  }
  function drawRecords(){
    refreshMonths();
    const f=recordMonth.value, all=loadRecords();
    const list=f==="ALL"?all:all.filter(r=>monthKey(r.date)===f);
    if(!list.length){recordsEl.innerHTML='<div class="empty">해당 월에 저장된 평가가 없습니다.</div>';return;}
    recordsEl.innerHTML=list.map(r=>{
      let cats="";
      Object.keys(r.categories||{}).forEach(cat=>{
        const c=r.categories[cat];
        cats+='<div class="result-cat"><b>'+escapeHTML(cat)+'</b> · '+c.sum+' / '+c.max+'<div>';
        (c.questions||[]).forEach(q=>{
          cats+='<div class="result-q"><b>'+q.no+'. '+escapeHTML(q.text)+'</b><br>';
          if(q.criteria&&q.criteria.length){
            cats+='<span style="color:#666">'+q.criteria.map(escapeHTML).join("<br>")+'</span><br>';
          }
          cats+=q.score+'점</div>';
        });
        cats+='</div></div>';
      });
      return '<div class="record">'+
        '<div class="record-head"><input class="record-check" type="checkbox" data-id="'+r.id+'">'+
        '<div><div class="record-title">'+escapeHTML(r.site||"구역 미상")+' . '+escapeHTML(r.date)+' . '+formatTime(r.savedAt)+'</div>'+
        '<div class="record-meta">피평가자: '+escapeHTML(r.evaluator||"")+'</div></div></div>'+
        '<div class="record-total">총점 '+escapeHTML(r.score)+'</div>'+
        '<details class="record-result"><summary>▶평가결과 조회</summary>'+cats+'</details>'+
        '<button class="delete-one" type="button" data-delete="'+r.id+'">이 평가 삭제</button>'+
        '</div>';
    }).join("");
  }
  function escapeHTML(v){
    return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  // Initial form values
  dateEl.value=today();
  Object.keys(DATA.zones).forEach(x=>region.add(new Option(x,x)));

  region.addEventListener("change",()=>{
    site.innerHTML='<option value="">구역 선택</option>';
    if(region.value){
      DATA.zones[region.value].forEach(x=>site.add(new Option(x,x)));
      site.disabled=false;
    }else{
      site.disabled=true;
    }
    resetEval();
  });
  site.addEventListener("change",()=>{
    resetEval();
    populateCats();
  });

  $("startBtn").addEventListener("click",()=>{dateEl.value=today();page(evalPage);});
  $("viewBtn").addEventListener("click",()=>{drawRecords();page(viewPage);});
  $("backEval").addEventListener("click",()=>page(home));
  $("backView").addEventListener("click",()=>page(home));
  finish.addEventListener("click",finishEvaluation);
  recordMonth.addEventListener("change",drawRecords);
  recordsEl.addEventListener("click",e=>{
    const del=e.target.closest(".delete-one");
    if(del){
      const id=Number(del.dataset.delete);
      if(confirm("이 평가를 삭제할까요?")){
        saveRecords(loadRecords().filter(r=>r.id!==id));
        drawRecords();
      }
    }
  });
  $("deleteSelected").addEventListener("click",()=>{
    const ids=[...document.querySelectorAll(".record-check:checked")].map(x=>Number(x.dataset.id));
    if(!ids.length){alert("삭제할 평가를 선택해주세요.");return;}
    if(confirm("선택한 평가를 삭제할까요?")){
      saveRecords(loadRecords().filter(r=>!ids.includes(Number(r.id))));
      drawRecords();
    }
  });
  $("deleteAll").addEventListener("click",()=>{
    if(!loadRecords().length){alert("삭제할 평가가 없습니다.");return;}
    if(confirm("저장된 평가를 전체 삭제할까요?")){
      saveRecords([]);
      drawRecords();
    }
  });
  topBtn.addEventListener("click",()=>{
    try{window.scrollTo({top:0,left:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}
  });
  page(home);
  try{drawRecords();}catch(e){}
})();
</script>

window.addEventListener("load", function(){
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
});
</script>
